version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_IDLE_TIMEOUT_SECONDS: ${DATABASE_IDLE_TIMEOUT_SECONDS:-30}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-3}
      ADMIN_SECRET: ${ADMIN_SECRET}
      AGENT_REGISTRATION_ENABLED: ${AGENT_REGISTRATION_ENABLED:-true}
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-http://localhost:3000}
      REDIS_URL: ${REDIS_URL:-}
      UPSTASH_REDIS_REST_URL: ${UPSTASH_REDIS_REST_URL:-}
      UPSTASH_REDIS_REST_TOKEN: ${UPSTASH_REDIS_REST_TOKEN:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      BACKUP_DIR: ${BACKUP_DIR:-/app/uploads/backups}
      BACKUP_LOCAL_RETENTION_DAYS: ${BACKUP_LOCAL_RETENTION_DAYS:-14}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-database-backups}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_FORCE_PATH_STYLE: ${BACKUP_S3_FORCE_PATH_STYLE:-false}
      API_LOG_RETENTION_DAYS: ${API_LOG_RETENTION_DAYS:-30}
      API_LOG_PRUNE_MODE: ${API_LOG_PRUNE_MODE:-delete}
      AI_L2_REVIEW_ENABLED: ${AI_L2_REVIEW_ENABLED:-false}
      AI_L2_BASE_URL: ${AI_L2_BASE_URL:-https://api.openai.com/v1}
      AI_L2_API_KEY: ${AI_L2_API_KEY:-}
      AI_L2_MODEL: ${AI_L2_MODEL:-gpt-4o-mini}
      AI_L2_TIMEOUT_MS: ${AI_L2_TIMEOUT_MS:-15000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      JOB_POLL_INTERVAL_MS: ${JOB_POLL_INTERVAL_MS:-5000}
      JOB_MAX_ITERATIONS: ${JOB_MAX_ITERATIONS:-0}
      JOB_RETENTION_DAYS: ${JOB_RETENTION_DAYS:-7}
      ANALYTICS_HASH_SALT: ${ANALYTICS_HASH_SALT:-agentpress}
      MAX_COMMENT_LENGTH: ${MAX_COMMENT_LENGTH:-5000}
      REACTION_TYPES: ${REACTION_TYPES:-like,love,insightful,bookmark}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Same image as app, different entrypoint. The worker claims jobs in SQL and
  # dispatches each one to the app's admin endpoint, so job runs go through the
  # same code path — and the same audit log — as manual admin actions.
  #
  # Behind a profile, so `docker compose up` on an existing deployment does not
  # silently gain a worker: start it with `--profile worker`. Starting the
  # service *is* the opt-in, so JOB_WORKER_ENABLED is pinned true here rather
  # than read from the shared env — a false there would make the container
  # print queue depth, exit 0, and be restarted forever by the restart policy.
  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "scripts/job-worker.mjs"]
    # The image's HEALTHCHECK wgets the Next server, which this container does
    # not run; left in place the worker would report unhealthy while working.
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-3}
      AGENTPRESS_INTERNAL_URL: ${AGENTPRESS_INTERNAL_URL:-http://app:3000}
      # Prefer a dedicated `worker:...` entry in ADMIN_TOKENS so the audit trail
      # distinguishes queued work from a person clicking approve.
      JOB_WORKER_ADMIN_TOKEN: ${JOB_WORKER_ADMIN_TOKEN:-}
      ADMIN_SECRET: ${ADMIN_SECRET}
      JOB_WORKER_ENABLED: "true"
      JOB_POLL_INTERVAL_MS: ${JOB_POLL_INTERVAL_MS:-5000}
      JOB_MAX_ITERATIONS: ${JOB_MAX_ITERATIONS:-0}
      JOB_HTTP_TIMEOUT_MS: ${JOB_HTTP_TIMEOUT_MS:-60000}
      JOB_STALE_TIMEOUT_MS: ${JOB_STALE_TIMEOUT_MS:-900000}
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentpress
      POSTGRES_USER: agentpress
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentpress"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
